<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" width="1400" height="540" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <title id="t">CourseFlow — LinkedIn for university students</title>
  <desc id="d">CourseFlow, project 05, status building. Peer-to-peer academic guidance for university students with a dashboard, semester stacks, verified anonymous reviews and live chat. Built with Next.js 16, TypeScript, Tailwind and Supabase. 187 commits, 2 stars.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x=".5" y=".5" width="1399" height="539" rx="20" fill="#101215" stroke="#2a2f36"/>
  <rect x="0" y="40" width="4" height="460" rx="2" fill="#f472b6"/>

  <!-- header row -->
  <rect x="40" y="34" width="112" height="26" rx="5" fill="none" stroke="#f472b6"/>
  <text x="96" y="52" font-size="11" font-weight="700" letter-spacing="1" fill="#f472b6" text-anchor="middle">PROJECT 05</text>
  <text x="170" y="52" font-size="12" letter-spacing="2" fill="#8b949e">UNIVERSITY NETWORK · PEER GUIDANCE</text>
  <rect x="1230" y="32" width="130" height="30" rx="8" fill="none" stroke="#f472b6"/>
  <text x="1295" y="52" font-size="13" font-weight="700" fill="#f472b6" text-anchor="middle">● building</text>

  <!-- title -->
  <text x="40" y="118" font-size="32" font-weight="700" fill="#e6edf3">CourseFlow — LinkedIn for university students</text>
  <rect x="40" y="140" width="345" height="26" rx="5" fill="none" stroke="#f472b6"/>
  <text x="52" y="158" font-size="12" font-weight="700" fill="#f472b6">next.js 16 · typescript · tailwind · supabase</text>

  <text x="40" y="214" font-size="15" fill="#8b949e">peer-to-peer academic guidance. plan your semesters, read verified</text>
  <text x="40" y="238" font-size="15" fill="#8b949e">anonymous reviews, and learn from students who took the path.</text>

  <!-- features -->
  <g font-size="15">
    <circle cx="48" cy="290" r="4" fill="#f5a524"/>
    <text x="64" y="295" font-weight="700" fill="#e6edf3">dashboard <tspan font-weight="400" font-size="14" fill="#8b949e">  gpa, credits and semester analytics</tspan></text>
    <circle cx="48" cy="322" r="4" fill="#a78bfa"/>
    <text x="64" y="327" font-weight="700" fill="#e6edf3">semester stacks <tspan font-weight="400" font-size="14" fill="#8b949e">  course bundles from real student paths</tspan></text>
    <circle cx="48" cy="354" r="4" fill="#4ade80"/>
    <text x="64" y="359" font-weight="700" fill="#e6edf3">verified reviews <tspan font-weight="400" font-size="14" fill="#8b949e">  anonymous, tied to real enrollment</tspan></text>
    <circle cx="48" cy="386" r="4" fill="#38bdf8"/>
    <text x="64" y="391" font-weight="700" fill="#e6edf3">live chat <tspan font-weight="400" font-size="14" fill="#8b949e">  connections, activity feed, shared resources</tspan></text>
  </g>

  <!-- illustration -->
  <circle cx="1130" cy="235" r="175" fill="url(#glow)"/>
  <circle cx="1130" cy="235" r="120" fill="none" stroke="#2a2f36" stroke-dasharray="2 6"/>
  <circle cx="1130" cy="235" r="70" fill="#14171c" stroke="#2a2f36"/>
  <g transform="translate(1130 235)">
    <path d="M-28 6 v22 c0 12 56 12 56 0 v-22 L0 20 Z" fill="#c2578f"/>
    <polygon points="0,-28 52,-4 0,20 -52,-4" fill="#f472b6"/>
    <line x1="46" y1="-1" x2="46" y2="26" stroke="#f5a524" stroke-width="3"/>
    <circle cx="46" cy="30" r="4" fill="#f5a524"/>
  </g>
  <g font-size="12" letter-spacing="2" font-weight="700">
    <circle cx="1130" cy="115" r="6" fill="#f5a524"/>
    <text x="1130" y="98" fill="#f5a524" text-anchor="middle">DASHBOARD</text>
    <circle cx="1250" cy="235" r="6" fill="#4ade80"/>
    <text x="1266" y="239" fill="#4ade80">REVIEWS</text>
    <circle cx="1130" cy="355" r="6" fill="#38bdf8"/>
    <text x="1130" y="382" fill="#38bdf8" text-anchor="middle">CHAT</text>
    <circle cx="1010" cy="235" r="6" fill="#a78bfa"/>
    <text x="994" y="239" fill="#a78bfa" text-anchor="end">STACKS</text>
  </g>

  <!-- flow -->
  <text x="40" y="436" font-size="12" font-weight="700" letter-spacing="2" fill="#f472b6">HOW IT FLOWS</text>
  <rect x="40" y="452" width="150" height="56" rx="10" fill="none" stroke="#2a2f36" stroke-dasharray="4 4"/>
  <text x="115" y="485" font-size="14" fill="#8b949e" text-anchor="middle">a student</text>
  <rect x="222" y="452" width="200" height="56" rx="10" fill="#16121a" stroke="#f472b6"/>
  <text x="322" y="476" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Next.js 16</text>
  <text x="322" y="496" font-size="11" fill="#8b949e" text-anchor="middle">dashboard ui</text>
  <rect x="454" y="452" width="260" height="56" rx="10" fill="#16121a" stroke="#f472b6"/>
  <text x="584" y="476" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Supabase</text>
  <text x="584" y="496" font-size="11" fill="#8b949e" text-anchor="middle">auth · postgres · rls · realtime</text>
  <rect x="746" y="452" width="150" height="56" rx="10" fill="none" stroke="#2a2f36" stroke-dasharray="4 4"/>
  <text x="821" y="485" font-size="14" fill="#8b949e" text-anchor="middle">peers</text>
  <g stroke="#f472b6" stroke-width="2">
    <line x1="190" y1="480" x2="222" y2="480"/>
    <line x1="422" y1="480" x2="454" y2="480"/>
    <line x1="714" y1="480" x2="746" y2="480"/>
  </g>

  <!-- stats -->
  <rect x="940" y="428" width="420" height="86" rx="10" fill="#101215" stroke="#2a2f36"/>
  <g font-size="11" fill="#8b949e">
    <text x="964" y="452">commits</text>
    <text x="1100" y="452">stars</text>
    <text x="1196" y="452">status</text>
  </g>
  <text x="964" y="494" font-size="28" font-weight="700" fill="#f472b6">187</text>
  <text x="1100" y="494" font-size="28" font-weight="700" fill="#e6edf3">2</text>
  <text x="1196" y="494" font-size="24" font-weight="700" fill="#f472b6">building</text>
</svg>
