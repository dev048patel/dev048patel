<svg xmlns="http://www.w3.org/2000/svg" width="840" height="218" viewBox="0 0 840 218" role="img" aria-label="Dev Patel — full-stack apps that real people use">
<title>Dev Patel — full-stack apps that real people use</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".035"/>
    <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="840" height="218" rx="12" fill="#0b0c0e"/>
<rect x="1" y="1" width="838" height="216" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="838" height="216" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="170" fill="#f5a524" opacity=".55"/><text x="26" y="30" class="cap dim">FULL-STACK · CS STUDENT · REGINA, SK · UPDATED 24 SEP 2026</text><text x="26" y="66" font-size="24" font-weight="800" fill="#e8e8e8">Dev Patel <tspan fill="#7a818c">—</tspan> <tspan fill="#f5a524" filter="url(#glow)">full-stack apps that real people use</tspan></text><text x="26" y="94" font-size="11" class="dim">cs student in regina, sk. react on the front, node + fastapi in the middle, postgres underneath.<tspan fill="#e8e8e8" font-weight="700"></tspan></text><text x="26" y="110" font-size="11" class="dim">i like clean ui, smooth motion, and breaking things to see how they work. <tspan fill="#e8e8e8" font-weight="700">school is a course list.</tspan></text><text x="26" y="126" font-size="11" class="dim"><tspan fill="#e8e8e8" font-weight="700">shipping is the part that compounds.</tspan></text><rect x="26" y="152" width="244.6" height="14" rx="3" fill="#ef4444" fill-opacity=".12" stroke="#ef4444" stroke-opacity=".8"/><text x="32" y="162" font-size="9.5" font-weight="700" fill="#ef4444" letter-spacing=".3">▸ gotransitregina.ca is down right now</text><rect x="278.61" y="152" width="171.5" height="14" rx="3" fill="#9aa1ab" fill-opacity=".12" stroke="#9aa1ab" stroke-opacity=".8"/><text x="284.61" y="162" font-size="9.5" font-weight="700" fill="#9aa1ab" letter-spacing=".3">▸ bus positions every 1.5s</text><rect x="458.08000000000004" y="152" width="171.5" height="14" rx="3" fill="#9aa1ab" fill-opacity=".12" stroke="#9aa1ab" stroke-opacity=".8"/><text x="464.08000000000004" y="162" font-size="9.5" font-weight="700" fill="#9aa1ab" letter-spacing=".3">▸ 116 commits and counting</text><rect x="26" y="180" width="16" height="16" rx="3" fill="#3a3f47" fill-opacity="0" stroke="#3a3f47"/><text x="34" y="191.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7a818c">1</text><rect x="48" y="180" width="16" height="16" rx="3" fill="#3a3f47" fill-opacity="0" stroke="#3a3f47"/><text x="56" y="191.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7a818c">2</text><rect x="70" y="180" width="16" height="16" rx="3" fill="#f5a524" fill-opacity="0.15" stroke="#f5a524"/><text x="78" y="191.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#f5a524">3</text><rect x="92" y="180" width="16" height="16" rx="3" fill="#3a3f47" fill-opacity="0" stroke="#3a3f47"/><text x="100" y="191.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7a818c">4</text><text x="124" y="192" font-size="9.5" class="dim">last commit 43 days ago · the product is a line that grows with every user</text><rect class="blink" x="553" y="183" width="6" height="11" fill="#f5a524"/>
</svg>