<svg xmlns="http://www.w3.org/2000/svg" width="840" height="46" viewBox="0 0 840 46" role="img" aria-label="the degree takes four years — the product gets better every time someone uses it">
<title>the degree takes four years — the product gets better every time someone uses it</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".035"/>
    <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="840" height="46" rx="12" fill="#0b0c0e"/>
<rect x="1" y="1" width="838" height="44" rx="11" fill="#101215" stroke="#23272e"/><text x="420.0" y="28" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e8e8e8">the degree takes four years <tspan fill="#7a818c">—</tspan> <tspan fill="#f5a524">the product gets better every time someone uses it</tspan></text><rect class="blink" x="706" y="18" width="6" height="12" fill="#f5a524"/>
</svg>