<svg xmlns="http://www.w3.org/2000/svg" width="420" height="310" viewBox="0 0 420 310" role="img" aria-label="GoTransit live-tracking loop: poll, cache, render every 1.5 seconds">
<title>GoTransit live-tracking loop: poll, cache, render every 1.5 seconds</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.belt{animation:belt 1s linear infinite}
@keyframes belt{to{stroke-dashoffset:-12}}
.pk{animation:pk 6s linear infinite}
@keyframes pk{
 0%{transform:translateX(0);fill:#4b5563;opacity:0}
 4%{opacity:1}
 16.9%{fill:#4b5563}17%{fill:#e5e7eb}
 49.9%{fill:#e5e7eb}50%{fill:#38bdf8}
 82.9%{fill:#38bdf8}83%{fill:#4ade80}
 96%{opacity:1}
 100%{transform:translateX(360px);fill:#4ade80;opacity:0}}
.st{animation:st 2s ease-in-out infinite}
@keyframes st{50%{stroke-opacity:.35}}
</style>

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".035"/>
    <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="420" height="310" rx="12" fill="#0b0c0e"/>
<rect x="1" y="1" width="418" height="308" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="308" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="262" fill="#38bdf8" opacity=".55"/><text x="406" y="300" text-anchor="end" font-size="64" font-weight="800" fill="#fff" opacity=".035">02</text><rect x="18" y="18" width="52.0" height="14" rx="3" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".8"/><text x="24" y="28" font-size="7.5" font-weight="700" fill="#38bdf8" letter-spacing=".3">THE LOOP</text><text x="78.0" y="28" class="cap dim" font-size="7.5">THREE STATIONS TOUCH EVERY BUS</text><rect x="340.1" y="15" width="61.9" height="18" rx="4" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8"/><text x="371.1" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#38bdf8">1.5s each</text><text x="18" y="56" font-size="14" font-weight="700" fill="#e8e8e8">Every bus rides the same loop, all day</text><rect x="18" y="66" width="247.0" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-opacity=".8"/><text x="24" y="76" font-size="7.5" font-weight="700" fill="#38bdf8" letter-spacing=".3">watch the boxes turn green as the map draws them</text><text x="210.0" y="104" text-anchor="middle" class="cap" fill="#38bdf8" font-size="9.5">EVERY BUS RIDES THE SAME LOOP</text><rect class="st" style="animation-delay:0.0s" x="40" y="116" width="96" height="42" rx="6" fill="#4ade80" fill-opacity=".04" stroke="#4ade80" stroke-opacity=".7"/><text x="88" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#e8e8e8">POLL</text><text x="88" y="148" text-anchor="middle" font-size="8" class="dim">/buses</text><rect x="80" y="158" width="16" height="10" fill="#4ade80" fill-opacity=".5"/><rect class="st" style="animation-delay:0.5s" x="162" y="116" width="96" height="42" rx="6" fill="#38bdf8" fill-opacity=".04" stroke="#38bdf8" stroke-opacity=".7"/><text x="210" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#e8e8e8">CACHE</text><text x="210" y="148" text-anchor="middle" font-size="8" class="dim">merge · diff</text><rect x="202" y="158" width="16" height="10" fill="#38bdf8" fill-opacity=".5"/><rect class="st" style="animation-delay:1.0s" x="284" y="116" width="96" height="42" rx="6" fill="#4ade80" fill-opacity=".04" stroke="#4ade80" stroke-opacity=".7"/><text x="332" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#e8e8e8">RENDER</text><text x="332" y="148" text-anchor="middle" font-size="8" class="dim">markers</text><rect x="324" y="158" width="16" height="10" fill="#4ade80" fill-opacity=".5"/><line x1="22" y1="190" x2="398" y2="190" stroke="#3a3f47" stroke-width="6" stroke-linecap="round"/><line class="belt" x1="22" y1="190" x2="398" y2="190" stroke="#2a2f36" stroke-width="2" stroke-dasharray="6 6"/><rect class="pk" style="animation-delay:0.0s" x="24" y="176" width="14" height="10" rx="2" fill="#4b5563"/><rect class="pk" style="animation-delay:-1.2s" x="24" y="176" width="14" height="10" rx="2" fill="#4b5563"/><rect class="pk" style="animation-delay:-2.4s" x="24" y="176" width="14" height="10" rx="2" fill="#4b5563"/><rect class="pk" style="animation-delay:-3.6s" x="24" y="176" width="14" height="10" rx="2" fill="#4b5563"/><rect class="pk" style="animation-delay:-4.8s" x="24" y="176" width="14" height="10" rx="2" fill="#4b5563"/><rect x="18" y="212" width="384" height="54" rx="6" fill="#0d0f12" stroke="#23272e"/><text x="32" y="232" text-anchor="start" font-size="8.5" class="dim">poll every</text><text x="32" y="254" text-anchor="start" font-size="16" font-weight="800" fill="#4ade80">1.5s</text><text x="210.0" y="232" text-anchor="middle" font-size="8.5" class="dim">polls an hour</text><text x="210.0" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#e8e8e8">2,400</text><text x="388" y="232" text-anchor="end" font-size="8.5" class="dim">stale buses</text><text x="388" y="254" text-anchor="end" font-size="16" font-weight="800" fill="#38bdf8">dropped</text><text x="210.0" y="296" text-anchor="middle" font-size="8.5" class="dim" opacity=".8">2,400 polls an hour · the loop never stops while the buses run</text>
</svg>